[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawview"
version = "1.3.4"
description = "Qt front-end and agent for Ghidra reverse engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6.0",
    "certifi>=2024.0.0",
    # Capped below 1.0: the 1.0 SDK drops `temperature` from messages.create/stream (and takes no
    # **kwargs), so every request for a model that still accepts sampling params raises TypeError.
    # It also swapped its httpx dependency for httpx2. Migrating to 1.x is deliberate work.
    "anthropic>=0.40.0,<1",
    # Imported directly by rawview.agent.providers; it used to arrive only as an anthropic
    # dependency, which broke the moment anthropic 1.0 switched to httpx2.
    "httpx>=0.27",
    "py4j>=0.10.9.7",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "qtawesome>=1.3.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pillow>=10.0"]
discord = ["pypresence>=4.3.0"]

[project.scripts]
rawview = "rawview.main:main"
rawview-re = "rawview.main:main_re"

[tool.setuptools.packages.find]
where = ["."]
include = ["rawview*"]

[tool.setuptools.package-data]
rawview = ["qt_ui/resources/*.png", "qt_ui/resources/*.ico"]
