name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.1 or v1.3.1. Must match pyproject.toml."
        required: true

permissions:
  contents: write

jobs:
  # ── Resolve the tag once, for both triggers ───────────────────────────────
  # A tag push already carries it; a manual run passes it in and the release job
  # creates the tag. Guards that it matches pyproject.toml, because every packaging
  # script derives its filenames from there (build-deb.sh, build-appimage.sh,
  # build-rpm.sh, scripts/build-msi.ps1) - a mismatch ships rawview_1.3.0_amd64.deb
  # inside a release called v1.3.1.
  version:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          else
            tag="${{ github.ref_name }}"
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

          project=$(grep -m1 '^\s*version\s*=' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "${tag#v}" != "$project" ]; then
            echo "::error::Tag $tag does not match pyproject.toml version $project."
            echo "::error::Bump pyproject.toml (and CHANGELOG.md) first, or tag v$project."
            exit 1
          fi

          case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease=$prerelease), pyproject.toml=$project"

  # ── Linux: .deb + .AppImage + .rpm ────────────────────────────────────────
  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y alien dpkg-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discord]"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and extract Ghidra 12.0.4
        run: |
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip"
          zip_path="$RUNNER_TEMP/ghidra.zip"
          extract_dir="$RUNNER_TEMP/ghidra"
          curl -L --progress-bar -o "$zip_path" "$url"
          unzip -q "$zip_path" -d "$extract_dir"
          inner=$(find "$extract_dir" -maxdepth 1 -type d -name "ghidra_*_PUBLIC" | head -1)
          echo "GHIDRA_INSTALL_DIR=$inner" >> "$GITHUB_ENV"

      - name: Compile Java bridge
        run: python -m rawview.scripts.compile_java

      - name: Import smoke (the app must start before we package it)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
          python - <<'PY'
          import importlib
          # Same chain the app walks at startup: main -> qt_ui.app -> main_window -> controller
          # -> agent.brain -> agent.providers. v1.3.1 shipped four packages that died here on an
          # undeclared httpx, because the release path never imported the app before packaging it.
          for name in [
              "rawview.config",
              "rawview.agent.providers",
              "rawview.agent.brain",
              "rawview.agent.conversation_summarize",
              "rawview.qt_ui.settings_dialog",
              "rawview.qt_ui.main_window",
          ]:
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Build PyInstaller bundle
        run: bash build-linux.sh

      - name: Build .deb
        run: bash build-deb.sh --skip-pyinstaller

      - name: Build .AppImage
        run: bash build-appimage.sh --skip-pyinstaller

      - name: Build .rpm
        run: bash build-rpm.sh --skip-pyinstaller

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist_installer/*.deb
            dist_installer/*.AppImage
            dist_installer/*.rpm
          if-no-files-found: error

  # ── Windows: .msi ─────────────────────────────────────────────────────────
  windows:
    name: Windows MSI
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discord]"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and extract Ghidra 12.0.4
        run: |
          $url = "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip"
          $zip = "$env:RUNNER_TEMP\ghidra.zip"
          $dir = "$env:RUNNER_TEMP\ghidra"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $inner = Get-ChildItem $dir -Directory | Where-Object { $_.Name -like "ghidra_*_PUBLIC" } | Select-Object -First 1
          echo "GHIDRA_INSTALL_DIR=$($inner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Compile Java bridge
        run: python -m rawview.scripts.compile_java
        shell: cmd

      - name: Import smoke (the app must start before we package it)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import importlib; [ (importlib.import_module(n), print('ok', n)) for n in ['rawview.config','rawview.agent.providers','rawview.agent.brain','rawview.agent.conversation_summarize','rawview.qt_ui.settings_dialog','rawview.qt_ui.main_window'] ]"
        shell: cmd

      - name: Install WiX Toolset 3.14
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $zip = "$env:RUNNER_TEMP\wix314.zip"
          $dir = "$env:RUNNER_TEMP\wix314"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "WIX=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Build MSI
        run: powershell -ExecutionPolicy Bypass -File scripts\build-msi.ps1
        shell: cmd

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist_installer\RawView-*.msi
          if-no-files-found: error

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [version, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist_installer/

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist_installer/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name makes a manual run create the tag at this commit; a tag push
          # resolves to the tag it already carries.
          tag_name: ${{ needs.version.outputs.tag }}
          name: "RawView ${{ needs.version.outputs.tag }}"
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist_installer/rawview_*.deb
            dist_installer/RawView-*.AppImage
            dist_installer/rawview-*.rpm
            dist_installer/RawView-*.msi
