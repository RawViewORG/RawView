name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate: lint for real errors + byte-compile every source file ──────────
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # Critical-error subset only (syntax errors, undefined names, bad f-strings,
      # broken except/comparisons). No style noise, so this stays meaningful.
      - name: Ruff (critical errors)
        run: ruff check --select E9,F63,F7,F82 rawview

      - name: Byte-compile all sources
        run: python -m compileall -q rawview

  # ── Import smoke: the package actually imports on supported Pythons ───────────
  import-smoke:
    name: Import smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # macos-14 is arm64; the platform branches it exercises are the ones
          # ubuntu never reaches.
          - os: macos-14
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 links Qt GUI libs (libEGL/libGL/...) at import time even under the
      # offscreen platform; ubuntu-latest doesn't ship them.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import core modules (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "rawview.config",
              "rawview.agent.claude_model_limits",
              "rawview.agent.anthropic_backoff",
              "rawview.agent.conversation_summarize",
              "rawview.agent.brain",
              "rawview.qt_ui.settings_dialog",
          ]
          for name in modules:
              importlib.import_module(name)
              print("ok", name)
          PY

  # ── macOS packaging, on demand ────────────────────────────────────────────
  # release.yml builds this for real on every tag; run it here from a branch to
  # prove the .app/.dmg path before cutting one.
  macos-package:
    name: macOS package check (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: Apple Silicon
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discord]"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and extract Ghidra
        run: |
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip"
          zip_path="$RUNNER_TEMP/ghidra.zip"
          extract_dir="$RUNNER_TEMP/ghidra"
          curl -fL --retry 3 -o "$zip_path" "$url"
          unzip -q "$zip_path" -d "$extract_dir"
          inner=$(find "$extract_dir" -maxdepth 1 -type d -name "ghidra_*_PUBLIC" | head -1)
          echo "GHIDRA_INSTALL_DIR=$inner" >> "$GITHUB_ENV"

      - name: Compile Java bridge
        run: python -m rawview.scripts.compile_java

      - name: Build Ghidra native binaries
        run: |
          set -euo pipefail
          cd "$GHIDRA_INSTALL_DIR/support/gradle"
          ./gradlew buildNatives
          cd "$GITHUB_WORKSPACE"
          python -m rawview.scripts.collect_ghidra_natives

      - name: Build .app and .dmg
        env:
          # No natives, no build - shipping a mac package that cannot analyze is worse
          # than failing the release.
          RAWVIEW_REQUIRE_GHIDRA_NATIVES: "1"
        run: bash build-macos.sh

      - name: Bundle smoke (signed, launchable, and able to analyze)
        run: |
          set -euo pipefail
          app="dist/RawView.app"
          test -x "$app/Contents/MacOS/RawView"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          # Ghidra ships no macOS natives; a bundle without ours opens fine and then
          # cannot analyze anything, which is how v1.3.5 shipped broken. Fail here instead.
          key="mac_arm_64"; [ "$(uname -m)" = "x86_64" ] && key="mac_x86_64"
          nat="$app/Contents/Resources/rawview/ghidra_natives/$key/Ghidra/Features/Decompiler/os/$key"
          test -x "$nat/decompile"
          test -x "$nat/sleigh"
          echo "bundled natives: $(file -b "$nat/decompile")"
          lipo -archs "$app/Contents/MacOS/RawView"
          ls -lh dist_installer/*.dmg

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos-check-${{ matrix.runner }}
          path: dist_installer/*.dmg
          if-no-files-found: error
